name: Build Android APK

on:
  push:
    branches:
      - claude/patel-de-batata-music-app-c97y89
      - main
  workflow_dispatch: # permite correr manualmente pelo browser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependências
        run: npm install

      - name: Corrigir ExpoModulesCorePlugin para AGP 8.3+
        # 'components.release' (property accessor) foi removido no AGP 8.3+.
        # Usar findByName() que funciona em todas as versões.
        run: |
          python3 << 'PYEOF'
          path = 'node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle'
          with open(path) as f:
              content = f.read()
          if 'from components.release' not in content:
              print('Linha não encontrada – nada a fazer')
          else:
              # Substituição inline compatível com Groovy: verifica null antes de chamar from
              content = content.replace(
                  'from components.release',
                  'def _rc = project.components.findByName("release"); if (_rc != null) from _rc'
              )
              with open(path, 'w') as f:
                  f.write(content)
              print('Patch aplicado com sucesso')
          PYEOF

      - name: Gerar projeto Android nativo (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Registar expo-module-gradle-plugin como composite build
        run: |
          python3 << 'PYEOF'
          path = 'android/settings.gradle'
          with open(path) as f:
              content = f.read()
          addon = "\n// Composite build para expor expo-module-gradle-plugin\nincludeBuild('../node_modules/expo-modules-core/android')\n"
          if 'expo-modules-core' not in content:
              content = content + addon
              with open(path, 'w') as f:
                  f.write(content)
              print('includeBuild adicionado com sucesso')
          else:
              print('Já existe – nada a fazer')
          PYEOF

      - name: Permissão ao Gradle wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PatelDeBatata-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
