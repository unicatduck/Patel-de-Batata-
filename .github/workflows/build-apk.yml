name: Build Android APK

on:
  push:
    branches:
      - claude/patel-de-batata-music-app-c97y89
      - main
  workflow_dispatch: # permite correr manualmente pelo browser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto Android nativo (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Corrigir AGP para 8.2.2 (components.release removido no AGP 8.3+)
        run: |
          sed -i 's/com\.android\.tools\.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.2.2/g' android/build.gradle
          echo "=== android/build.gradle ==="
          cat android/build.gradle

      - name: Permissão ao Gradle wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PatelDeBatata-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
