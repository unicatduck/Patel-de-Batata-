name: Build Android APK

on:
  push:
    branches:
      - claude/patel-de-batata-music-app-c97y89
      - main
  workflow_dispatch: # permite correr manualmente pelo browser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependências
        run: npm install

      - name: Corrigir ExpoModulesCorePlugin para AGP 8.3+
        # 'components.release' (property accessor) foi removido no AGP 8.3+.
        # Usar findByName() que funciona em todas as versões.
        run: |
          python3 << 'PYEOF'
          path = 'node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle'
          with open(path) as f:
              content = f.read()
          if 'from components.release' not in content:
              print('Linha não encontrada – nada a fazer')
          else:
              # Substituição inline compatível com Groovy: verifica null antes de chamar from
              content = content.replace(
                  'from components.release',
                  'def _rc = project.components.findByName("release"); if (_rc != null) from _rc'
              )
              with open(path, 'w') as f:
                  f.write(content)
              print('Patch aplicado com sucesso')
          PYEOF

      - name: Corrigir expo-document-picker para AGP 8.3+ / Gradle 7+
        run: |
          python3 << 'PYEOF'
          path = 'node_modules/expo-document-picker/android/build.gradle'
          with open(path) as f:
              content = f.read()
          changed = False
          # Fix 1: components.release removido no AGP 8.3+
          if 'from components.release' in content:
              content = content.replace(
                  'from components.release',
                  'def _rc2 = project.components.findByName("release"); if (_rc2 != null) from _rc2'
              )
              changed = True
          # Fix 2: classifier= removido no Gradle 7+ (usar archiveClassifier)
          if "classifier = 'sources'" in content:
              content = content.replace("classifier = 'sources'", "archiveClassifier = 'sources'")
              changed = True
          if changed:
              with open(path, 'w') as f:
                  f.write(content)
              print('Patches aplicados com sucesso')
          else:
              print('Nada a fazer')
          PYEOF

      - name: Gerar projeto Android nativo (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Ajustar minSdkVersion para 24 (react-native-track-player exige API 24+)
        run: |
          python3 << 'PYEOF'
          import re
          path = 'android/build.gradle'
          with open(path) as f:
              content = f.read()
          patched = re.sub(r'minSdkVersion\s*=\s*2[0-3]', 'minSdkVersion = 24', content)
          if patched != content:
              with open(path, 'w') as f:
                  f.write(patched)
              print('minSdkVersion atualizado para 24')
          else:
              print('minSdkVersion já é 24 ou superior – nada a fazer')
          PYEOF

      - name: Remover repositório de snapshots Sonatype (evita timeouts de rede)
        run: |
          python3 << 'PYEOF'
          import os, re
          # Procura em TODOS os ficheiros .gradle dentro de android/
          fixed = []
          for root, dirs, files in os.walk('android'):
              dirs[:] = [d for d in dirs if d not in ['build', '.gradle', '.cxx', 'intermediates']]
              for fname in files:
                  if not (fname.endswith('.gradle') or fname.endswith('.gradle.kts')):
                      continue
                  path = os.path.join(root, fname)
                  with open(path) as f:
                      content = f.read()
                  if 'sonatype' not in content:
                      continue
                  print(f'Encontrado sonatype em: {path}')
                  # Remove bloco maven { ... } que contém "sonatype" (funciona com single e multi-line)
                  patched = re.sub(
                      r'[ \t]*maven\s*\{[^}]*sonatype[^}]*\}\s*\n?',
                      '',
                      content,
                      flags=re.IGNORECASE
                  )
                  if patched != content:
                      with open(path, 'w') as f:
                          f.write(patched)
                      fixed.append(path)
                      print(f'  -> Removido de {path}')
                  else:
                      print(f'  -> Regex não correspondeu, a remover linha com sed...')
                      # Fallback: remove qualquer linha que contenha a URL sonatype
                      lines = content.splitlines(keepends=True)
                      lines = [l for l in lines if 'sonatype' not in l]
                      with open(path, 'w') as f:
                          f.writelines(lines)
                      fixed.append(path)
                      print(f'  -> Linhas removidas de {path}')
          if not fixed:
              print('Sonatype não encontrado em nenhum ficheiro gradle')
          PYEOF

      - name: Garantir que release usa debug keystore (APK de teste)
        run: |
          python3 << 'PYEOF'
          import re
          path = 'android/app/build.gradle'
          with open(path) as f:
              content = f.read()
          # Se o bloco release não tiver signingConfig, adiciona o debug keystore
          release_match = re.search(r'release\s*\{([^}]*)\}', content, re.DOTALL)
          if release_match and 'signingConfig' not in release_match.group(1):
              content = content.replace(
                  'release {',
                  'release {\n            signingConfig signingConfigs.debug',
                  1
              )
              with open(path, 'w') as f:
                  f.write(content)
              print('signingConfig adicionado ao release')
          else:
              print('signingConfig já existe – nada a fazer')
          PYEOF

      - name: Permissão ao Gradle wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK release (bundle JS com dev=false)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PatelDeBatata-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
