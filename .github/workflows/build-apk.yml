name: Build Android APK

on:
  push:
    branches:
      - claude/patel-de-batata-music-app-c97y89
      - main
  workflow_dispatch: # permite correr manualmente pelo browser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Expo e EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm install

      - name: Inicializar projeto EAS (cria na cloud se não existe)
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK na cloud EAS
        id: build
        run: |
          JSON=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json 2>/dev/null)
          echo "$JSON"
          BUILD_URL=$(echo "$JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if isinstance(data, list):
              print(data[0].get('artifacts', {}).get('buildUrl', ''))
          else:
              print(data.get('artifacts', {}).get('buildUrl', ''))
          " 2>/dev/null || echo "")
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Descarregar APK
        if: steps.build.outputs.build_url != ''
        run: wget -q -O PatelDeBatata.apk "${{ steps.build.outputs.build_url }}"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PatelDeBatata-${{ github.run_number }}
          path: PatelDeBatata.apk
          retention-days: 30
